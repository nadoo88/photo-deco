<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>✨ 사진 꾸미기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Black+Han+Sans&family=Playfair+Display:ital,wght@0,700;1,400&family=Pacifico&family=Space+Mono&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#f3eef8;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.bar{flex-shrink:0;background:linear-gradient(120deg,#ff69b4,#a855d4);padding:9px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(168,85,212,.3)}
.bar h1{color:#fff;font-size:14px;font-weight:800;letter-spacing:.2px}
.bar button{padding:6px 13px;border-radius:20px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.btn-o{background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.6)!important;color:#fff}
.btn-o:hover{background:rgba(255,255,255,.35)}
.btn-s{background:#fff;color:#a855d4}
.btn-s:hover{background:#f5eaff}
.wrap{display:flex;flex:1;min-height:0}
/* ── Stage ── */
.stage{flex:1;display:flex;align-items:center;justify-content:center;background:#bebebe;overflow:hidden;padding:14px}
/* Canvas wrapper — both canvases stack perfectly here */
#cw{display:none;position:relative;line-height:0;box-shadow:0 8px 32px rgba(0,0,0,.25)}
#cv{display:block}                         /* template layer */
#txcv{position:absolute;top:0;left:0;      /* text overlay — always on top of cv */
      cursor:crosshair;touch-action:none}
/* ── Upload ── */
.drop{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.dropbox{background:#fff;border:3px dashed #c4a0e8;border-radius:22px;padding:44px 52px;text-align:center;cursor:pointer;max-width:320px;transition:.2s}
.dropbox:hover,.dropbox.over{border-color:#a855d4;background:#faf0ff;transform:scale(1.01)}
.dropbox .em{font-size:54px;display:block;margin-bottom:12px}
.dropbox h2{font-size:17px;color:#a855d4;font-weight:700;margin-bottom:4px}
.dropbox p{font-size:12px;color:#bbb}
/* ── Panel ── */
.panel{width:218px;background:#fff;border-left:1.5px solid #e8d8f8;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sec-hd{font-size:10px;font-weight:700;color:#a855d4;padding:7px 10px 5px;border-bottom:1px solid #f0d8f8;letter-spacing:.6px;flex-shrink:0;background:#fdf8ff}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:6px;overflow-y:auto;flex:1}
.card{border:2px solid #edd8f8;border-radius:9px;overflow:hidden;cursor:pointer;transition:.15s}
.card:hover{border-color:#a855d4;transform:scale(1.04)}
.card.on{border-color:#a855d4;box-shadow:0 0 0 2px rgba(168,85,212,.25)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#f3eef8}
.card-lbl{font-size:9px;font-weight:700;text-align:center;padding:3px 2px;color:#aaa;line-height:1.3}
.card.on .card-lbl{color:#a855d4}
/* ── Text panel ── */
.txt-wrap{flex-shrink:0;border-top:1px solid #f0d8f8;padding:7px 8px 9px;display:flex;flex-direction:column;gap:5px}
.txt-row{display:flex;align-items:center;gap:4px}
.ti{flex:1;padding:5px 8px;border:1.5px solid #e0d0f0;border-radius:8px;font-size:12px;outline:none}
.ti:focus{border-color:#a855d4}
.ti::placeholder{color:#ccc}
.sw-lbl{font-size:9px;color:#aaa;font-weight:700;letter-spacing:.4px}
.swatches{display:flex;flex-wrap:wrap;gap:4px;padding:2px 0}
.sw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:.12s}
.sw:hover{transform:scale(1.25)}
.sw.on{border-color:#a855d4;box-shadow:0 0 0 1.5px #a855d4}
.sw-c{width:20px;height:20px;border-radius:50%;cursor:pointer;border:1.5px solid #ddd;flex-shrink:0;padding:0}
.sz-sl{flex:1;accent-color:#a855d4;height:3px;cursor:pointer}
.sz-v{font-size:11px;color:#999;min-width:22px;text-align:right}
.fs{flex:1;padding:4px 5px;border:1.5px solid #e0d0f0;border-radius:7px;font-size:11px;color:#666;background:#fff;outline:none;cursor:pointer}
.fs:focus{border-color:#a855d4}
.txb-row{display:flex;gap:4px}
.txb{flex:1;padding:5px 2px;border-radius:7px;border:1.5px solid #e0d0f0;cursor:pointer;font-size:11px;font-weight:700;background:#fff;color:#888;transition:.15s}
.txb:hover{border-color:#a855d4;color:#a855d4}
.txb.on{background:#a855d4;color:#fff;border-color:#a855d4}
.act-row{display:flex;gap:4px}
.add-btn{flex:1;padding:5px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:700;background:linear-gradient(120deg,#ff69b4,#a855d4);color:#fff}
.add-btn:hover{opacity:.88}
.del-btn{width:30px;padding:5px;border-radius:7px;border:1.5px solid #ffcdd2;background:#fff0f0;color:#e05050;cursor:pointer;font-size:12px}
.sel-info{display:none;font-size:9px;color:#a855d4;font-weight:700;text-align:center;padding:2px 0}
.hint{font-size:9px;color:#ccc;text-align:center;line-height:1.4}
.panel-ft{padding:7px 8px;border-top:1px solid #f0d8f8;flex-shrink:0}
.savebtn{width:100%;padding:8px;background:linear-gradient(120deg,#ff69b4,#a855d4);color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px}
.savebtn:hover{opacity:.9}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:5px 18px;border-radius:20px;display:none;pointer-events:none;z-index:999}
</style>
</head>
<body>
<div class="bar">
  <button class="btn-o" id="btnNew">← 새 사진</button>
  <h1>✨ 사진 꾸미기 21종</h1>
  <button class="btn-s" id="btnSave">저장 💾</button>
</div>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="drop" id="dropZone">
      <div class="dropbox" id="dropBox">
        <span class="em">📸</span>
        <h2>사진을 클릭하거나 드래그</h2>
        <p>JPG · PNG · WEBP 지원</p>
      </div>
    </div>
    <!-- Canvas wrapper: txcv is absolutely positioned inside, always perfectly covering cv -->
    <div id="cw">
      <canvas id="cv"></canvas>
      <canvas id="txcv"></canvas>
    </div>
  </div>
  <div class="panel">
    <div class="sec-hd">🎨 TEMPLATES (21)</div>
    <div class="tgrid" id="tgrid"></div>
    <div class="sec-hd">✏️ 텍스트 추가</div>
    <div class="txt-wrap">
      <div class="txt-row"><input class="ti" id="txtIn" type="text" placeholder="텍스트 입력..."></div>
      <div class="sw-lbl">글자색</div>
      <div class="swatches" id="swatches"></div>
      <div class="txt-row">
        <span style="font-size:9px;color:#aaa">직접선택</span>
        <input class="sw-c" id="txtColor" type="color" value="#ffffff">
        <span style="font-size:9px;color:#aaa;margin-left:4px">크기</span>
        <input class="sz-sl" id="txtSize" type="range" min="8" max="80" value="24">
        <span class="sz-v" id="szVal">24</span>
      </div>
      <div class="txt-row">
        <select class="fs" id="txtFont">
          <option value="-apple-system,sans-serif">기본체</option>
          <option value="'Noto Sans KR',sans-serif">노토산스 KR</option>
          <option value="'Black Han Sans',sans-serif">블랙한 KR굵</option>
          <option value="'Playfair Display',serif">Playfair</option>
          <option value="'Pacifico',cursive">Pacifico</option>
          <option value="'Space Mono',monospace">Space Mono</option>
          <option value="'Bebas Neue',sans-serif">Bebas Neue</option>
          <option value="Georgia,serif">Georgia</option>
          <option value="'Comic Sans MS',cursive">Comic Sans</option>
        </select>
      </div>
      <div class="txb-row">
        <button class="txb" id="txB" title="굵게">B</button>
        <button class="txb" id="txI" title="기울임"><i>I</i></button>
        <button class="txb" id="txS" title="그림자">Sh</button>
        <button class="txb" id="txO" title="테두리">Ou</button>
      </div>
      <div class="act-row">
        <button class="add-btn" id="btnAdd">+ 텍스트 추가</button>
        <button class="del-btn" id="btnDel">🗑</button>
      </div>
      <div class="sel-info" id="selInfo">✅ 선택됨 — 드래그로 이동</div>
      <div class="hint">텍스트 클릭=선택 · 드래그=이동</div>
    </div>
    <div class="panel-ft"><button class="savebtn" id="btnSave2">저장 💾</button></div>
  </div>
</div>
<input type="file" accept="image/*" id="fi" style="display:none">
<div class="toast" id="toast">저장 중...</div>

<script>
/* ─── Templates ─── */
var TPLS=[
  {id:'y2k',        e:'💎', n:'Y2K 글램'},
  {id:'scrapbook',  e:'🗂️', n:'스크랩북'},
  {id:'ui',         e:'🖥️', n:'UI 감성'},
  {id:'fav',        e:'⭐', n:'즐겨찾기'},
  {id:'doodle',     e:'✏️', n:'흰 낙서'},
  {id:'film',       e:'📷', n:'코닥 필름'},
  {id:'bluezoom',   e:'🔵', n:'줌박스'},
  {id:'photodump',  e:'📸', n:'포토덤프'},
  {id:'travel',     e:'✈️', n:'여행콜라주'},
  {id:'notepad',    e:'📝', n:'노트패드'},
  {id:'lucky',      e:'🍀', n:'럭키스크랩'},
  {id:'urban',      e:'🏙️', n:'어반매거진'},
  {id:'kaomoji',    e:'(◕ω)', n:'카오모지'},
  {id:'music',      e:'🎵', n:'뮤직카드'},
  {id:'split',      e:'🎨', n:'애니분할'},
  {id:'cozyroom',   e:'🏠', n:'코지룸'},
  {id:'corkboard',  e:'📌', n:'코르크보드'},
  {id:'streetinset',e:'🌟', n:'스트리트'},
  {id:'pinkstar',   e:'🩷', n:'핑크스타'},
  {id:'bowdeco',    e:'🎀', n:'리본데코'},
  {id:'dualstars',  e:'✦',  n:'듀얼스타'}
];

/* ─── Color presets ─── */
var PRESETS=[
  '#ffffff','#000000','#ff69b4','#a855d4','#ffd700','#87ceeb',
  '#ff4757','#2ed573','#ff8c00','#c0c0c0','#ff1493','#1e90ff',
  '#fffacd','#dda0dd','#00ced1','#f8bbd9','#b5ead7','#fce4ec'
];

/* ─── State ─── */
var photo=null, curId='y2k';
var items=[], nid=1, sel=null, drag=null, dox=0, doy=0;

var cv =document.getElementById('cv');
var txcv=document.getElementById('txcv');
var cw =document.getElementById('cw');

/* ─── RNG ─── */
function rng(seed){var s=(seed|0)||1;return function(){s^=s<<13;s^=s>>17;s^=s<<5;return(s>>>0)/4294967296;};}

/* ─── Color swatches ─── */
(function(){
  var el=document.getElementById('swatches');
  PRESETS.forEach(function(c,i){
    var d=document.createElement('div');d.className='sw'+(i===0?' on':'');
    d.style.background=c;if(c==='#ffffff'||c==='#fffacd')d.style.border='2px solid #ccc';
    d.onclick=function(){
      document.getElementById('txtColor').value=c.length===7?c:'#ffffff';
      document.querySelectorAll('.sw').forEach(function(x){x.classList.remove('on');});
      d.classList.add('on');
      applyPropToSel('color',c);
    };
    el.appendChild(d);
  });
})();
document.getElementById('txtColor').oninput=function(){applyPropToSel('color',this.value);};

/* ─── File load ─── */
function loadFile(f){
  if(!f||!f.type.startsWith('image/'))return;
  var fr=new FileReader();
  fr.onload=function(e){
    var im=new Image();
    im.onload=function(){photo=im;items=[];sel=null;showEditor();apply(curId);buildGrid();};
    im.onerror=function(){alert('이미지 로드 실패');};
    im.src=e.target.result;
  };
  fr.onerror=function(){alert('파일 읽기 실패');};
  fr.readAsDataURL(f);
}
function initDrop(){
  var b=document.getElementById('dropBox');if(!b)return;
  b.onclick=function(){document.getElementById('fi').click();};
  b.ondragover=function(e){e.preventDefault();b.classList.add('over');};
  b.ondragleave=function(){b.classList.remove('over');};
  b.ondrop=function(e){e.preventDefault();b.classList.remove('over');loadFile(e.dataTransfer.files[0]);};
}
document.getElementById('fi').onchange=function(e){loadFile(e.target.files[0]);this.value='';};

function showEditor(){
  document.getElementById('dropZone').style.display='none';
  cw.style.display='block';
}

/* ─── Apply template ─── */
function apply(id){
  if(!photo)return;
  curId=id;
  var st=document.getElementById('stage');
  /* Scale photo to fit stage minus padding */
  var mw=st.clientWidth-28, mh=st.clientHeight-28;
  var sc=Math.min(1,mw/photo.naturalWidth,mh/photo.naturalHeight);
  var W=Math.round(photo.naturalWidth*sc), H=Math.round(photo.naturalHeight*sc);
  /* Set both canvases to same pixel dimensions */
  cv.width=W; cv.height=H;
  txcv.width=W; txcv.height=H;
  /* Paint template on base canvas */
  paintTPL(cv.getContext('2d'),photo,W,H,id,rng(42));
  /* Draw text overlay on top canvas */
  drawOvl();
  /* Highlight selected card */
  document.querySelectorAll('.card').forEach(function(c){c.classList.toggle('on',c.dataset.id===id);});
}

/* ─── Text overlay ─── */
function drawOvl(){
  if(!photo)return;
  var ctx=txcv.getContext('2d');
  ctx.clearRect(0,0,txcv.width,txcv.height);
  /* Scale from natural-image coords to canvas pixels */
  var sx=txcv.width/photo.naturalWidth, sy=txcv.height/photo.naturalHeight;
  items.forEach(function(t){
    ctx.save();
    var fs=(t.it?'italic ':'')+(t.bd?'bold ':'')+Math.round(t.sz*sx)+'px '+t.fn;
    ctx.font=fs; ctx.textAlign='left'; ctx.textBaseline='top';
    if(t.ou){ctx.strokeStyle='rgba(0,0,0,.85)';ctx.lineWidth=Math.max(1,t.sz*sx*0.07);ctx.strokeText(t.tx,t.x*sx,t.y*sy);}
    if(t.sh){ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=t.sz*sx*0.14;ctx.shadowOffsetX=1;ctx.shadowOffsetY=1;}
    ctx.fillStyle=t.co; ctx.fillText(t.tx,t.x*sx,t.y*sy);
    if(t.id===sel){
      ctx.shadowBlur=0;ctx.shadowColor='transparent';ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
      var m=ctx.measureText(t.tx),tw=m.width,th=t.sz*sx*1.2;
      ctx.strokeStyle='rgba(168,85,212,.9)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
      ctx.strokeRect(t.x*sx-3,t.y*sy-3,tw+6,th+6);ctx.setLineDash([]);
    }
    ctx.restore();
  });
}

/* ─── Pointer events on txcv ─── */
txcv.addEventListener('pointerdown',function(e){
  if(!photo)return;
  e.preventDefault();
  /* Convert client coords → canvas pixels */
  var r=txcv.getBoundingClientRect();
  var scr=txcv.width/r.width, sci=txcv.height/r.height;
  var px=(e.clientX-r.left)*scr, py=(e.clientY-r.top)*sci;
  /* Scale to natural-image space for hit-testing */
  var sx=txcv.width/photo.naturalWidth, sy=txcv.height/photo.naturalHeight;
  var ctx=txcv.getContext('2d'), hit=null;
  for(var i=items.length-1;i>=0;i--){
    var t=items[i];
    ctx.font=(t.it?'italic ':'')+(t.bd?'bold ':'')+Math.round(t.sz*sx)+'px '+t.fn;
    var tw=ctx.measureText(t.tx).width+8, th=t.sz*sx*1.2+8;
    var lx=t.x*sx-4, ly=t.y*sy-4;
    if(px>=lx&&px<=lx+tw&&py>=ly&&py<=ly+th){hit=t;break;}
  }
  if(hit){
    sel=hit.id; drag=hit.id;
    /* Store offset in canvas-pixel space */
    dox=px-hit.x*sx; doy=py-hit.y*sy;
    txcv.setPointerCapture(e.pointerId);
    fillUI(hit);
  } else {
    sel=null;
  }
  drawOvl(); updateSelUI();
});

txcv.addEventListener('pointermove',function(e){
  if(!drag)return;
  e.preventDefault();
  var r=txcv.getBoundingClientRect();
  var scr=txcv.width/r.width, sci=txcv.height/r.height;
  var px=(e.clientX-r.left)*scr, py=(e.clientY-r.top)*sci;
  var sx=txcv.width/photo.naturalWidth, sy=txcv.height/photo.naturalHeight;
  var t=items.find(function(x){return x.id===drag;});
  if(t){
    t.x=Math.max(0,(px-dox)/sx);
    t.y=Math.max(0,(py-doy)/sy);
    drawOvl();
  }
});

txcv.addEventListener('pointerup',function(){drag=null;});
txcv.addEventListener('pointercancel',function(){drag=null;});

/* ─── UI sync ─── */
function fillUI(t){
  document.getElementById('txtIn').value=t.tx;
  document.getElementById('txtColor').value=t.co.length===7?t.co:'#ffffff';
  document.getElementById('txtSize').value=t.sz;
  document.getElementById('szVal').textContent=t.sz;
  document.getElementById('txB').classList.toggle('on',t.bd);
  document.getElementById('txI').classList.toggle('on',t.it);
  document.getElementById('txS').classList.toggle('on',t.sh);
  document.getElementById('txO').classList.toggle('on',t.ou);
  document.getElementById('txtFont').value=t.fn;
}
function updateSelUI(){
  document.getElementById('selInfo').style.display=sel!==null?'block':'none';
  if(sel!==null){var t=items.find(function(x){return x.id===sel;});if(t)fillUI(t);}
}
function applyPropToSel(k,v){
  if(sel!==null){var t=items.find(function(x){return x.id===sel;});if(t){t[k]=v;drawOvl();}}
}

/* ─── Text controls ─── */
document.getElementById('txtSize').oninput=function(){
  document.getElementById('szVal').textContent=this.value;
  applyPropToSel('sz',+this.value);
};
document.getElementById('txtIn').oninput=function(){applyPropToSel('tx',this.value);};
document.getElementById('txtFont').onchange=function(){applyPropToSel('fn',this.value);};
['txB','txI','txS','txO'].forEach(function(bid,bi){
  var keys=['bd','it','sh','ou'];
  document.getElementById(bid).onclick=function(){
    this.classList.toggle('on');
    if(sel!==null){var t=items.find(function(x){return x.id===sel;});if(t){t[keys[bi]]=this.classList.contains('on');drawOvl();}}
  };
});

document.getElementById('btnAdd').onclick=function(){
  if(!photo){alert('사진을 먼저 업로드하세요.');return;}
  var txt=document.getElementById('txtIn').value.trim();
  if(!txt){alert('텍스트를 입력하세요.');return;}
  var it={
    id:nid++, tx:txt,
    x:photo.naturalWidth*0.1, y:photo.naturalHeight*0.45,
    sz:+document.getElementById('txtSize').value,
    co:document.getElementById('txtColor').value,
    bd:document.getElementById('txB').classList.contains('on'),
    it:document.getElementById('txI').classList.contains('on'),
    sh:document.getElementById('txS').classList.contains('on'),
    ou:document.getElementById('txO').classList.contains('on'),
    fn:document.getElementById('txtFont').value
  };
  items.push(it); sel=it.id; drawOvl(); updateSelUI();
};

document.getElementById('btnDel').onclick=function(){
  if(sel!==null){items=items.filter(function(x){return x.id!==sel;});sel=null;}
  else if(items.length)items.pop();
  drawOvl(); updateSelUI();
};

/* ─── Build thumbnail grid ─── */
function buildGrid(){
  var g=document.getElementById('tgrid'); g.innerHTML='';
  TPLS.forEach(function(t){
    var tw=160,th=Math.round(photo.naturalHeight*(tw/photo.naturalWidth));
    var tc=document.createElement('canvas');tc.width=tw;tc.height=th;
    try{paintTPL(tc.getContext('2d'),photo,tw,th,t.id,rng(42));}
    catch(e){tc.getContext('2d').drawImage(photo,0,0,tw,th);}
    var card=document.createElement('div');card.className='card'+(t.id===curId?' on':'');card.dataset.id=t.id;
    var img=document.createElement('img');img.style.cssText='width:100%;aspect-ratio:3/4;object-fit:cover;display:block';img.src=tc.toDataURL('image/jpeg',.75);
    var lbl=document.createElement('div');lbl.className='card-lbl';lbl.textContent=t.e+' '+t.n;
    card.appendChild(img);card.appendChild(lbl);
    card.onclick=function(){apply(t.id);};g.appendChild(card);
  });
}

/* ─── Save ─── */
function doSave(){
  if(!photo){alert('사진을 먼저 업로드해주세요.');return;}
  var toast=document.getElementById('toast');toast.style.display='block';
  setTimeout(function(){
    try{
      var oc=document.createElement('canvas');
      var MAX=3000,sc=Math.min(1,MAX/photo.naturalWidth,MAX/photo.naturalHeight);
