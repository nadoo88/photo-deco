<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}html,body{margin:0}*{box-sizing:border-box}
/* Layout: one arcade screen. A 9:16 canvas fitted to the viewport, HTML overlays for the hangar, pause and report. Single dark look by design. */
:root{
  --ink:#060f19;
  --panel:rgba(6,15,25,.62);
  --card:rgba(10,24,38,.72);
  --sand:#eef0f2;
  --signal:#ffb627;
  --flare:#ff5a36;
  --mist:#93abbf;
  --line:rgba(238,240,242,.18);
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ui:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--sand);font-family:var(--ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{height:100%;box-sizing:border-box;padding-inline:16px;padding-block:8px;display:grid;place-items:center}
#stage{position:relative;container-type:size;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(0,0,0,.6)}
#cv{display:block;width:100%;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4cqh;padding:5cqw;text-align:center;background:linear-gradient(180deg,rgba(6,15,25,.35),var(--panel) 30%,rgba(6,15,25,.8))}
.kicker{font-family:var(--mono);letter-spacing:.32em;font-size:3.2cqw;color:var(--signal);margin:0}
h1{font-family:var(--display);font-weight:400;font-size:11.5cqw;line-height:1;margin:0;color:var(--sand);text-shadow:0 .5cqw 0 rgba(0,0,0,.45),0 0 7cqw rgba(120,190,255,.35);text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:10cqw;margin:0;text-wrap:balance}
.head{display:flex;flex-direction:column;gap:1.6cqw;align-items:center}
.jets{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;width:90cqw}
.jet{font:inherit;color:var(--sand);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1.4cqw 1cqw 1.8cqw;display:flex;flex-direction:column;align-items:center;gap:.4cqw;cursor:pointer;min-width:0}
.jet canvas{width:100%;aspect-ratio:5/4;max-width:100%;display:block}
.jet b{font-family:var(--display);font-weight:400;font-size:3.9cqw;line-height:1.1;white-space:nowrap}
.jet small{font-size:3cqw;color:var(--mist)}
.jet[aria-pressed="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal),0 0 4cqw rgba(255,182,39,.25);background:rgba(40,32,10,.6)}
.jet[aria-pressed="true"] small{color:var(--signal)}
.spec{width:90cqw;box-sizing:border-box;padding:2.6cqw 3.4cqw;border:1px dashed var(--line);border-radius:4px;display:grid;gap:1.6cqw;text-align:left}
.spec p{margin:0;font-size:3.9cqw;line-height:1.3;color:var(--sand)}
.spec .nm{font-family:var(--display);font-size:4.6cqw}
.spec .nm span{color:var(--mist);font-family:var(--ui);font-size:3.6cqw;margin-left:1.5cqw}
.bars{display:grid;grid-template-columns:auto 1fr;gap:1cqw 3cqw;align-items:center;font-size:3.4cqw;color:var(--mist)}
.pips{display:flex;gap:1cqw}
.pips i{flex:1;height:1.8cqw;border-radius:1px;background:rgba(238,240,242,.14)}
.pips i.on{background:var(--signal)}
.brief{font-size:3.4cqw;color:var(--mist);margin:0;line-height:1.45}
.brief b{color:var(--sand);font-weight:400}
.btn{font:inherit;font-family:var(--display);font-size:6.2cqw;color:#1b1406;background:var(--signal);border:0;border-radius:3px;padding:2.4cqw 11cqw;cursor:pointer;box-shadow:0 1.2cqw 0 #9a6a0c;letter-spacing:.06em}
.btn:active{transform:translateY(1cqw);box-shadow:0 .2cqw 0 #9a6a0c}
.btn.ghost{background:transparent;color:var(--sand);box-shadow:inset 0 0 0 2px var(--line);font-size:4.8cqw;padding:2cqw 7cqw}
.btn:focus-visible,.icon:focus-visible,#rollBtn:focus-visible,.jet:focus-visible{outline:3px solid var(--sand);outline-offset:3px}
.stack{display:flex;flex-direction:column;align-items:center;gap:3cqw}
.scores{display:grid;grid-template-columns:auto auto;gap:1.5cqw 6cqw;font-size:4.6cqw;align-items:baseline}
.scores dt{color:var(--mist);text-align:right}

.new{color:var(--signal);font-size:4.4cqw;margin:0}
#rollBtn{position:absolute;right:4cqw;bottom:4cqw;width:19cqw;height:19cqw;border-radius:50%;border:2px solid var(--signal);background:rgba(6,15,25,.5);color:var(--sand);font-family:var(--display);font-size:4.4cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(3px)}
#rollBtn span{font-family:var(--mono);font-size:5cqw;color:var(--signal)}
#rollBtn.empty{border-color:var(--line);opacity:.5}
.icon{position:absolute;top:2.6cqw;left:50%;transform:translateX(-50%);width:10cqw;height:8cqw;border-radius:3px;border:1px solid var(--line);background:rgba(6,15,25,.45);color:var(--sand);font-family:var(--mono);font-size:4cqw;cursor:pointer}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}

<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" aria-label="게임 화면"></canvas>
    <button id="pauseBtn" class="icon" type="button" aria-label="일시정지" hidden>II</button>
    <button id="rollBtn" type="button" aria-label="배럴롤 회피" hidden>회피<span id="rollN">3</span></button>

    <section id="title" class="screen">
      <div class="head">
        <p class="kicker">PACIFIC · NEXT GEN</p>
        <h1>태평양 비행대</h1>
      </div>
      <div class="jets" id="jets" role="group" aria-label="기체 선택"></div>
      <div class="spec" aria-live="polite">
        <p class="nm" id="specName"></p>
        <p id="specDesc"></p>
        <div class="bars" id="specBars"></div>
      </div>
      <div class="stack">
        <button id="startBtn" class="btn" type="button">출격</button>
        <p class="brief"><b>드래그</b> 이동 · 자동 사격 · <b>회피</b> 버튼 배럴롤<br>PC: 방향키 · 스페이스 · P 일시정지 · 최고 <span id="titleHi">0</span></p>
      </div>
    </section>

    <section id="pause" class="screen" hidden>
      <h2>일시정지</h2>
      <div class="stack">
        <button id="resumeBtn" class="btn" type="button">계속하기</button>
        <button id="muteBtn" class="btn ghost" type="button">소리 끄기</button>
        <button id="quitBtn" class="btn ghost" type="button">격납고로</button>
      </div>
    </section>

    <section id="over" class="screen" hidden>
      <p class="kicker">MISSION REPORT</p>
      <h2>격추당했습니다</h2>
      <dl class="scores">
        <dt>기체</dt><dd id="finalJet">KF-21</dd>
        <dt>점수</dt><dd id="finalScore">0</dd>
        <dt>도달</dt><dd id="finalStage">1</dd>
        <dt>최고</dt><dd id="finalHi">0</dd>
      </dl>
      <p id="newHi" class="new" hidden>최고 기록 갱신</p>
      <div class="stack">
        <button id="retryBtn" class="btn" type="button">다시 출격</button>
        <button id="homeBtn" class="btn ghost" type="button">격납고로</button>
      </div>
    </section>
  </div>
</div>

<script>
(()=>{
const W=360,H=640;
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d'),stage=$('stage'),wrap=$('wrap');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let scale=1,dpr=1;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const d2=(ax,ay,bx,by)=>(ax-bx)**2+(ay-by)**2;
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

function fit(){
  const cs=getComputedStyle(wrap);
  const aw=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=wrap.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  scale=Math.max(.3,Math.min(aw/W,ah/H));
  dpr=Math.min(window.devicePixelRatio||1,2);
  stage.style.width=W*scale+'px';stage.style.height=H*scale+'px';
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);
}
addEventListener('resize',fit);fit();

/* ================= aircraft ================= */
// All shapes: right half outline, nose up (-y). Mirrored at draw time.
const JETS=[
 {id:'kf21',name:'KF-21 보라매',short:'KF-21',nation:'대한민국',desc:'균형형 4.5세대. 화력 MAX에서 유도미사일 발사',bars:[3,4,3],
  half:[[0,-25],[2.2,-18],[4,-11],[6,-5],[7,-1],[17,8],[17,11],[8,11],[8,13],[12,19],[12,21],[5,21],[4,23],[0,23]],
  lines:[[4,9,7,18]],canopy:[0,-13,2.3,5.5],canopyC:'#7fb8e6',nozzles:[[-2.6,23,2.2],[2.6,23,2.2]],roundel:['kor',11.5,7,2.6],
  paint:{base:'#8e979e',light:'#c9d1d6',dark:'#59626a'},spd:1,hit:5,rollT:1.15,rolls:3,missileAt:3,
  gun:{rate:.11,dmg:1,w:3,lv:[[[-5,0],[5,0]],[[-13,0],[13,0]],[[-16,-.2],[16,.2]]]}},
 {id:'f35',name:'F-35A 라이트닝 II',short:'F-35A',nation:'미국',desc:'스텔스. 회피 무적시간이 길고 회피 4회로 시작',bars:[3,3,5],
  half:[[0,-24],[2.5,-17],[5,-10],[7,-4],[7,0],[16,7],[16,10],[8,12],[8,14],[12,19],[12,21],[4,20],[3.5,22],[0,22]],
  lines:[[4,9,5,17]],canopy:[0,-12,2.5,6],canopyC:'#d8ac4a',nozzles:[[0,22,3.2]],roundel:['usa',11,6.5,2.6],
  paint:{base:'#6c7378',light:'#a1a9ae',dark:'#454c51'},spd:.95,hit:5,rollT:1.7,rolls:4,missileAt:0,
  gun:{rate:.11,dmg:1.15,w:3,lv:[[[-4,0],[4,0]],[[-10,0],[10,0]],[[0,0],[-14,-.08],[14,.08]]]}},
 {id:'su57',name:'Su-57 펠론',short:'Su-57',nation:'러시아',desc:'초기동. 이동 속도 최고, 부채꼴 탄막',bars:[5,3,3],
  half:[[0,-26],[2,-18],[4,-12],[9,-7],[10,-4],[19,7],[19,10],[10,10],[10,12],[16,19],[16,21],[7,19],[6,23],[3,23],[2,20],[0,20]],
  lines:[[5,6,8,16]],canopy:[0,-15,2,5],canopyC:'#6aa8d8',nozzles:[[-4.5,23,2.4],[4.5,23,2.4]],roundel:['rus',13.5,7,2.8],
  paint:{base:'#7f9ab0',light:'#bccfdd',dark:'#4c6274'},spd:1.3,hit:5,rollT:1.1,rolls:3,missileAt:0,
  gun:{rate:.11,dmg:1,w:3,lv:[[[-5,-.06],[5,.06]],[[-9,-.22],[9,.22]],[[-12,-.4],[12,.4]]]}},
 {id:'j20',name:'J-20 위룽',short:'J-20',nation:'중국',desc:'중화력. 연사는 느리지만 한 발이 강력',bars:[2,5,3],
  half:[[0,-27],[2,-19],[4,-13],[5,-10],[11,-6],[11,-4],[5,-4],[6,0],[17,11],[17,13],[7,13],[7,16],[10,20],[10,21],[4,21],[3,24],[0,24]],
  lines:[[5,10,6,19]],canopy:[0,-16,2,6],canopyC:'#d8ac4a',nozzles:[[-2.6,24,2.3],[2.6,24,2.3]],roundel:['chn',12,9,2.6],
  paint:{base:'#5d646b',light:'#959ea5',dark:'#383e44'},spd:.9,hit:5,rollT:1.15,rolls:3,missileAt:0,
  gun:{rate:.14,dmg:1.8,w:4.5,lv:[[[0,0]],[[-7,0],[7,0]],[[-14,-.12],[14,.12]]]}},
 {id:'rafale',name:'라팔 F4',short:'Rafale',nation:'프랑스',desc:'멀티롤. 화력 2단계부터 유도미사일',bars:[3,4,3],
  half:[[0,-25],[2,-17],[4,-10],[9,-6],[9,-4],[5,-3],[6,0],[18,13],[18,15],[5,17],[3,20],[0,20]],
  lines:[[0,6,0,16]],canopy:[0,-14,2,5.5],canopyC:'#d8ac4a',nozzles:[[-2.4,20,2],[2.4,20,2]],roundel:['fra',11,9.5,2.8],
  paint:{base:'#9aa3a9',light:'#d3dadd',dark:'#626b71'},spd:1.05,hit:5,rollT:1.15,rolls:3,missileAt:2,
  gun:{rate:.11,dmg:1,w:3,lv:[[[-5,0],[5,0]],[[-13,0],[13,0]],[[-16,-.2],[16,.2]]]}},
 {id:'gripen',name:'그리펜 E',short:'Gripen E',nation:'스웨덴',desc:'경량 고속연사. 피격 판정이 가장 작음',bars:[4,3,4],
  half:[[0,-24],[1.8,-16],[3.5,-10],[8,-7],[8,-5],[4,-4],[5,-1],[15,12],[15,14],[4,15],[2.5,19],[0,19]],
  lines:[[0,6,0,15]],canopy:[0,-13,1.8,5],canopyC:'#7fb8e6',nozzles:[[0,19,2.6]],roundel:['swe',9.5,9,2.4],
  paint:{base:'#8a939a',light:'#c2cbd1',dark:'#58616a'},spd:1.12,hit:3.6,rollT:1.15,rolls:3,missileAt:0,
  gun:{rate:.075,dmg:.75,w:2.6,lv:[[[-4,0],[4,0]],[[-11,0],[11,0]],[[-14,-.16],[14,.16]]]}},
];
const EFLAME=['255,236,210','255,120,60','255,50,40'];
const PFLAME=['255,255,255','140,200,255','255,150,70'];
const FOES={
 drone:{half:[[0,-12],[16,4],[16,6],[11,6],[7,9],[3,7],[0,9]],paint:{base:'#7a3f37',light:'#b8695d',dark:'#4a221e'},
  nozzles:[[0,8,2.2]],accent:[[[16,4],[12.5,1],[12.5,5.5]]],sensor:[0,-4,2]},
 bomber:{half:[[0,-20],[34,6],[34,9],[26,11],[20,8],[13,12],[7,9],[0,13]],paint:{base:'#5d4a4b',light:'#927676',dark:'#382b2c'},
  nozzles:[[-8,10,2.6],[8,10,2.6]],accent:[[[34,6],[29,2],[29,8]]],sensor:[0,-8,3]},
 boss:{half:[[0,-46],[80,8],[80,14],[66,17],[54,12],[40,18],[26,12],[14,20],[0,16]],paint:{base:'#4d4446',light:'#827375',dark:'#2c2627'},
  nozzles:[[-14,18,3.5],[14,18,3.5],[-40,17,3],[40,17,3]],accent:[[[80,8],[72,2],[72,11]],[[60,-5],[50,-11],[50,-3]]],sensor:[0,-26,4],
  turrets:[[0,-18],[-24,2],[24,2],[-50,8],[50,8]]},
};
for(const d of [...JETS,...Object.values(FOES)]){d.span=Math.max(...d.half.map(p=>p[0]));let t=d.half[0];for(const p of d.half)if(p[0]>t[0])t=p;d.tip=t}

function craftPath(c,half){
  c.beginPath();half.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));
  for(let i=half.length-1;i>=0;i--){const [x,y]=half[i];if(x!==0)c.lineTo(-x,y)}
  c.closePath();
}
function star(c,x,y,r,ir){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?ir:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.fill()}
function disc(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}
function roundel(c,type,x,y,r){
  if(type==='kor'){disc(c,x,y,r,'#f4f4f4');const R=r*.72;disc(c,x,y,R,'#1f4fa8');c.fillStyle='#d6283a';c.beginPath();c.arc(x,y,R,Math.PI,Math.PI*2);c.fill();disc(c,x-R/2,y,R/2,'#d6283a');disc(c,x+R/2,y,R/2,'#1f4fa8')}
  else if(type==='usa'){disc(c,x,y,r,'#1d3566');c.fillStyle='#f4f4f4';c.fillRect(x+r*.6,y-r*.28,r*.9,r*.56);c.fillRect(x-r*1.5,y-r*.28,r*.9,r*.56);star(c,x,y,r*.85,r*.35)}
  else if(type==='rus'){c.fillStyle='#f4f4f4';star(c,x,y,r*1.25,r*.6);c.fillStyle='#d42a2a';star(c,x,y,r*.95,r*.42)}
  else if(type==='chn'){c.fillStyle='#d42a2a';c.fillRect(x-r*1.5,y-r*.3,r*3,r*.6);c.fillStyle='#ffd23f';star(c,x,y,r*1.05,r*.45);c.fillStyle='#d42a2a';star(c,x,y,r*.7,r*.3)}
  else if(type==='fra'){disc(c,x,y,r,'#e5283a');disc(c,x,y,r*.66,'#f4f4f4');disc(c,x,y,r*.33,'#1f4fa8')}

  const g=c.createLinearGradient(-s,0,s,0);g.addColorStop(0,p.dark);g.addColorStop(.42,p.light);g.addColorStop(.58,p.light);g.addColorStop(1,p.dark);

  c.restore();
  c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=.8;craftPath(c,def.half);c.stroke();
  if(def.lines){c.strokeStyle=p.dark;c.lineWidth=1.8;c.lineCap='round';
    for(const [x1,y1,x2,y2] of def.lines){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);if(x1||x2){c.moveTo(-x1,y1);c.lineTo(-x2,y2)}c.stroke()}}
  if(def.roundel){const [ty,x,y,r]=def.roundel;roundel(c,ty,x,y,r);roundel(c,ty,-x,y,r)}
  if(def.canopy){const [x,y,rx,ry]=def.canopy;const g3=c.createLinearGradient(-rx,y-ry,rx,y+ry);g3.addColorStop(0,'#ffffff');g3.addColorStop(.35,def.canopyC);g3.addColorStop(1,'#1a2a3a');c.fillStyle=g3;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}
  if(def.sensor){const [x,y,r]=def.sensor;const blink=.5+.5*Math.sin((o.t||0)*6);disc(c,x,y,r,`rgba(255,${80+blink*100},60,${.6+blink*.4})`)}

}

  return {x:rand(10,W-10),y:y??-r*1.8,r,pts,atoll,runway:!atoll&&r>52,rot:rand(-.6,.6),
    palms:Array.from({length:Math.floor(r/5)},()=>{const a=rand(0,7),d=atoll?rand(.78,.9):rand(0,.55);return [Math.cos(a)*r*d,Math.sin(a)*r*d*.85,rand(2,3.6)]}),

function updateBg(dt){
  bg.time+=dt;seaOff=(seaOff+SEA*dt)%H;
  if(bg.fade>0)bg.fade=Math.max(0,bg.fade-dt*.5);
  for(const g of bg.glints){g.y+=SEA*dt;if(g.y>H+5){g.y=-5;g.x=rand(0,W)}}
  for(const s of bg.islands)s.y+=SEA*dt;
  bg.islands=bg.islands.filter(s=>s.y<H+s.r*2);
  if((bg.isleT-=dt)<=0){bg.islands.push(mkIsland());bg.isleT=rand(5,11)}
  for(const s of bg.ships)s.y+=(SEA+s.vy)*dt;
  bg.ships=bg.ships.filter(s=>s.y<H+260);
  if((bg.shipT-=dt)<=0){bg.ships.push(mkShip());bg.shipT=rand(14,24)}
  for(const c of bg.clouds)c.y+=c.spd*dt;
  bg.clouds=bg.clouds.filter(c=>c.y<H+120*c.k);
  if((bg.cloudT-=dt)<=0){bg.clouds.push(mkCloud());bg.cloudT=rand(1.2,3)}
}

let ac=null,muted=false,noiseBuf=null;
function initAudio(){
  try{
    if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();
      noiseBuf=ac.createBuffer(1,ac.sampleRate*.8,ac.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    if(ac.state==='suspended')ac.resume();
  }catch(e){ac=null}
}
function tone(f,dur,type='square',vol=.04,slide=0){
  if(!ac||muted)return;const t=ac.currentTime;
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02);
}
function boom(dur=.35,vol=.25,freq=900){
  if(!ac||muted)return;const t=ac.currentTime;
  const s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(80,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(ac.destination);s.start(t);s.stop(t+dur);
}
const sfx={
  shot(){tone(1200,.035,'square',.01,-600)},

  hit(){tone(220,.05,'square',.03,-80)},

  big(){boom(.8,.35,700)},

  roll(){boom(.5,.12,3000);tone(300,.4,'sawtooth',.03,500)},

};

/* ================= game state ================= */
let mode='title',G=null;
function newGame(){
  const J=JETS[jetIdx];
  G={J,score:0,stage:1,t:0,lives:3,power:1,rolls:J.rolls,nextLife:30000,
    p:{x:W/2,y:H-110,r:J.hit,inv:2.5,roll:0,fire:0,mfire:0,dead:0,alive:true,vx:0,tx:null,ty:null},
    pb:[],ms:[],eb:[],en:[],fx:[],items:[],trail:[],
    bossOn:false,bossDelay:0,clear:0,overT:0,shake:0,shotN:0,

/* ================= enemies ================= */
function mkEnemy(type,o){
  const base={type,t:0,x:0,y:0,px:0,py:0,ang:Math.PI,flash:0,fire:rand(1,2.6),delay:0,on:false};
  if(type==='drone')Object.assign(base,{r:13,hp:G.stage>2?2.5:1.2,score:100});
  if(type==='bomber')Object.assign(base,{r:30,hp:22+G.stage*8,score:1500,fire:1.4});
  if(type==='boss')Object.assign(base,{r:60,hp:340+G.stage*170,score:20000,fire:2,gun:1});
  base.maxHp=base.hp;return Object.assign(base,o);
}
function spawnWave(){
  const k=pick(['sine','dive','cross','sine','dive','v']);
  const wave={n:0,killed:0,ok:true};
  if(k==='sine'){const x0=rand(80,W-80);for(let i=0;i<5;i++)G.en.push(mkEnemy('drone',{path:'sine',x:x0,x0,y:-30,ph:i*.55,delay:i*.3,wave}))}
  if(k==='dive'||k==='v'){const x0=rand(90,W-90);for(let i=0;i<5;i++){const off=i-2;
    G.en.push(mkEnemy('drone',{path:'dive',x:x0+off*32,y:-30-Math.abs(off)*26,dir:(x0<W/2?1:-1)*(k==='v'&&off<0?-1:1),wave}))}}
  if(k==='cross'){const left=Math.random()<.5,y=rand(70,190);for(let i=0;i<4;i++)G.en.push(mkEnemy('drone',{path:'cross',x:left?-30:W+30,y,vx:left?165:-165,delay:i*.32,wave}))}
  wave.n=G.en.filter(e=>e.wave===wave).length;
}
const spawnBomber=()=>G.en.push(mkEnemy('bomber',{x:rand(80,W-80),y:-50}));
const spawnBoss=()=>G.en.push(mkEnemy('boss',{x:W/2,y:-100}));
function fireAt(x,y,a,spd){G.eb.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:3.6})}
const aim=(x,y)=>Math.atan2(G.p.y-y,G.p.x-x);
const bspd=()=>150+G.stage*18;

function updEnemy(e,dt){
  if(e.delay>0){e.delay-=dt;return}
  e.on=true;e.t+=dt;e.px=e.x;e.py=e.y;
  if(e.flash>0)e.flash-=dt;
  const p=G.p;
  if(e.type==='drone'){
    if(e.path==='sine'){e.y+=125*dt;e.x=e.x0+Math.sin(e.t*2.2+e.ph)*72}
    else if(e.path==='dive'){if(e.t<1.1)e.y+=175*dt;else{e.vy=(e.vy??175)-340*dt;e.y+=e.vy*dt;e.x+=e.dir*150*dt}}
    else{e.x+=e.vx*dt;e.y+=(35+Math.sin(e.t*3)*25)*dt}
    const vx=(e.x-e.px)/dt,vy=(e.y-e.py)/dt;
    if(vx||vy){const da=wrapA(Math.atan2(vx,-vy)-e.ang);e.ang+=clamp(da,-.25,.25)}
    if((e.fire-=dt)<=0){e.fire=rand(2.2,4)/(1+G.stage*.18);if(e.y>10&&e.y<H*.62&&p.alive)fireAt(e.x,e.y,aim(e.x,e.y),bspd())}
    if(e.t>1&&(e.y>H+40||e.y<-50||e.x<-50||e.x>W+50)){e.dead=true;if(e.wave)e.wave.ok=false}
  }else if(e.type==='bomber'){
    if(e.t<13){if(e.y<140)e.y+=55*dt;else e.x=clamp(e.x+Math.cos(e.t*.7)*50*dt,45,W-45)}else e.y+=70*dt;
    if((e.fire-=dt)<=0&&e.y>20&&p.alive){e.fire=Math.max(1,1.9-G.stage*.12);const n=G.stage>1?5:3,a=aim(e.x,e.y+12);
      for(let i=0;i<n;i++)fireAt(e.x,e.y+12,a+(i-(n-1)/2)*.2,bspd()*.9)}
    if(e.y>H+60)e.dead=true;
  }else if(e.type==='boss'){
    if(e.y<125)e.y+=55*dt;else e.x=W/2+Math.sin((e.t-1.5)*.55)*90;
    if(e.y>=110&&p.alive){
      const rage=e.hp<e.maxHp*.5?1.5:1;
      if((e.fire-=dt*rage)<=0){e.fire=2.4;const n=12+G.stage*2,o=rand(0,1);for(let i=0;i<n;i++)fireAt(e.x,e.y+10,o+i/n*Math.PI*2,bspd()*.8);sfx.hit()}
      if((e.gun-=dt*rage)<=0){e.gun=.95;
        for(const [lx,ly] of [FOES.boss.turrets[1],FOES.boss.turrets[2]]){
          for(let k=0;k<3;k++)setTimeout(()=>{if(mode==='play'&&!e.dead&&G){const x=e.x-lx,y=e.y-ly;fireAt(x,y,aim(x,y),bspd()*1.1)}},k*110)}}
    }
  }
}
function hitTest(e,x,y,pad){
  const dx=Math.abs(x-e.x),dy=-(y-e.y);
  if(e.type==='boss')return dx<80+pad&&dy<20+pad&&dy>-46+dx*(54/80)-pad;
  if(e.type==='bomber')return dx<34+pad&&dy<13+pad&&dy>-20+dx*(26/34)-pad;
  return d2(x,y,e.x,e.y)<(e.r+pad)**2;
}

/* ================= effects ================= */
function explode(x,y,size=1){
  const n=Math.round(14*size),fx=G.fx;
  for(let i=0;i<n;i++){const a=rand(0,7),s=rand(30,160)*Math.sqrt(size);
    fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s+SEA,life:rand(.35,.8)*Math.sqrt(size),r:rand(2,5)*Math.sqrt(size),c:pick(['255,210,110','255,140,66','255,90,54','255,245,210']),glow:1})}
  for(let i=0;i<n/2;i++){const a=rand(0,7),s=rand(10,50);
    fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s+SEA,life:rand(.6,1.2)*Math.sqrt(size),r:rand(4,9)*Math.sqrt(size),c:'smoke'})}
  fx.push({ring:true,x,y,life:.35,r:18*size});
  fx.push({flashOrb:true,x,y,life:.18,r:26*size});
  for(const f of fx)if(!f.max)f.max=f.life;
  if(!reduce)G.shake=Math.max(G.shake,size*3);
}
function dropItem(x,y,k){G.items.push({x,y,k,t:0})}
function addScore(n){
  G.score+=n;
  if(G.score>=G.nextLife){G.lives=Math.min(6,G.lives+1);G.nextLife+=50000;sfx.life();G.banner={text:'1UP',sub:'잔기 +1',t:1.4}}
}
function kill(e){
  e.dead=true;addScore(e.score);
  if(e.type==='drone'){explode(e.x,e.y,1);sfx.pop();
    if(e.wave){e.wave.killed++;if(e.wave.ok&&e.wave.killed===e.wave.n){dropItem(e.x,e.y,'P');addScore(500)}}
    if(Math.random()<.05)dropItem(e.x,e.y,'R');}
  else if(e.type==='bomber'){explode(e.x,e.y,2.2);sfx.big();dropItem(e.x-10,e.y,'P');if(Math.random()<.5)dropItem(e.x+12,e.y,'R')}
  else{
    sfx.big();for(let i=0;i<9;i++)setTimeout(()=>{if(G){explode(e.x+rand(-70,70),e.y+rand(-30,40),rand(1.4,2.6));sfx.pop()}},i*140);
    G.eb=[];dropItem(e.x-14,e.y,'P');dropItem(e.x+14,e.y,'R');G.clear=4;
    G.banner={text:`STAGE ${G.stage} 클리어`,sub:`보너스 +${(G.stage*5000).toLocaleString()}`,t:3};addScore(G.stage*5000);
  }
}
function hurt(e,dmg){e.hp-=dmg;e.flash=.05;if(e.hp<=0)kill(e);else if(e.type!=='drone'&&Math.random()<.3)sfx.hit()}

/* ================= player ================= */
function shoot(){
  const p=G.p,J=G.J,S=660;
  for(let l=0;l<G.power;l++)for(const [dx,a] of J.gun.lv[l])G.pb.push({x:p.x+dx,y:p.y-18,vx:Math.sin(a)*S,vy:-Math.cos(a)*S,dmg:J.gun.dmg,w:J.gun.w});
  if(++G.shotN%3===0)sfx.shot();
}
function launchMissiles(){const p=G.p;for(const s of[-1,1])G.ms.push({x:p.x+s*12,y:p.y+4,vx:s*140,vy:-120,t:0,tg:null});sfx.missile()}
function doRoll(){
  if(mode!=='play'||!G.p.alive||G.p.roll>0||G.rolls<=0)return;
  G.rolls--;G.p.roll=G.J.rollT;sfx.roll();syncHud();
}
function die(){
  const p=G.p;p.alive=false;p.dead=1.5;explode(p.x,p.y,2.4);sfx.die();G.trail=[];
  try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
  G.lives--;G.power=Math.max(1,G.power-1);
  if(G.lives<=0)G.overT=1.8;
  syncHud();
}

/* ================= update ================= */
const keys={};
let drag=null;
function update(dt){
  const p=G.p,J=G.J;G.t+=dt;
  if(G.banner)G.banner.t-=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*14);

  if(p.alive){
    const ox=p.x,sp=270*J.spd;
    const kx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);
    const ky=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
    if(kx||ky){const m=Math.hypot(kx,ky);p.x+=kx/m*sp*dt;p.y+=ky/m*sp*dt}
    if(drag&&p.tx!=null){const dx=p.tx-p.x,dy=p.ty-p.y,dd=Math.hypot(dx,dy),mx=560*J.spd*dt;
      if(dd<=mx){p.x=p.tx;p.y=p.ty}else{p.x+=dx/dd*mx;p.y+=dy/dd*mx}}
    p.x=clamp(p.x,18,W-18);p.y=clamp(p.y,50,H-30);
    p.vx+=((p.x-ox)/dt-p.vx)*.2;
    if(p.inv>0)p.inv-=dt;if(p.roll>0)p.roll-=dt;
    if((p.fire-=dt)<=0){p.fire=J.gun.rate;shoot()}
    if(J.missileAt&&G.power>=J.missileAt&&(p.mfire-=dt)<=0){p.mfire=.75;launchMissiles()}
    // contrails from wingtips
    const tip=J.tip,rp=p.roll>0?1-p.roll/J.rollT:0,sx=rp?Math.cos(rp*Math.PI*2):1;
    for(const t of G.trail)t.y+=330*dt;
    G.trail.push({lx:p.x-tip[0]*sx,rx:p.x+tip[0]*sx,y:p.y+tip[1]});
    if(G.trail.length>24)G.trail.shift();
  }else if(G.overT<=0){
    if((p.dead-=dt)<=0){p.alive=true;p.x=W/2;p.y=H-110;p.inv=2.4;p.roll=0;drag=null}
  }
  if(G.overT>0&&(G.overT-=dt)<=0){gameOver();return}

  if(!G.bossOn&&G.clear<=0){
    if((G.nextWave-=dt)<=0){spawnWave();G.nextWave=Math.max(1.3,3.1-G.stage*.25)+rand(0,1)}
    if((G.nextBomber-=dt)<=0){spawnBomber();G.nextBomber=Math.max(9,rand(14,20)-G.stage)}
    if(G.t>50){G.bossOn=true;G.bossDelay=3;G.banner={text:'경고',sub:'거대 공중요새 접근 중',t:2.8,warn:true};sfx.warn()}
  }
  if(G.bossDelay>0&&(G.bossDelay-=dt)<=0)spawnBoss();
  if(G.clear>0&&(G.clear-=dt)<=0){
    G.stage++;G.t=0;G.bossOn=false;G.nextWave=1.5;G.nextBomber=14;
    const th=THEMES[(G.stage-1)%THEMES.length];setTheme(G.stage-1);
    G.banner={text:`STAGE ${G.stage}`,sub:th.name,t:2.6};
  }

  for(const b of G.pb){b.x+=b.vx*dt;b.y+=b.vy*dt}
  for(const b of G.eb){b.x+=b.vx*dt;b.y+=b.vy*dt}
  for(const m of G.ms){
    m.t+=dt;
    if(!m.tg||m.tg.dead){let best=null,bd=1e9;for(const e of G.en){if(!e.on||e.dead||e.y<-20)continue;const d=d2(e.x,e.y,m.x,m.y);if(d<bd){bd=d;best=e}}m.tg=best}
    let a=Math.atan2(m.vy,m.vx),s=Math.min(520,Math.hypot(m.vx,m.vy)+700*dt);
    if(m.tg&&m.t>.15){const da=wrapA(Math.atan2(m.tg.y-m.y,m.tg.x-m.x)-a);a+=clamp(da,-7*dt,7*dt)}
    else if(m.t>.15){const da=wrapA(-Math.PI/2-a);a+=clamp(da,-4*dt,4*dt)}
    m.vx=Math.cos(a)*s;m.vy=Math.sin(a)*s;m.x+=m.vx*dt;m.y+=m.vy*dt;
    G.fx.push({x:m.x-Math.cos(a)*6,y:m.y-Math.sin(a)*6,vx:rand(-8,8),vy:SEA,life:.4,max:.4,r:2.2,c:'smoke'});
    if(m.t>3||m.y<-30||m.y>H+30||m.x<-30||m.x>W+30)m.dead=true;
  }
  for(const e of G.en)updEnemy(e,dt);
  for(const it of G.items){it.t+=dt;it.y+=55*dt;it.x+=Math.sin(it.t*3)*30*dt}
  for(const f of G.fx){f.life-=dt;if(!f.ring&&!f.flashOrb){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.96;f.vy=f.vy*.96+SEA*.04}}

  for(const b of [...G.pb,...G.ms]){if(b.dead||b.y<-20){b.dead=true;continue}
    for(const e of G.en){if(!e.on||e.dead)continue;if(hitTest(e,b.x,b.y,3)){b.dead=true;
      if(b.dmg)hurt(e,b.dmg);else{hurt(e,3);explode(b.x,b.y,.5)}break}}}

  if(p.alive&&p.inv<=0&&p.roll<=0){
    for(const b of G.eb)if(d2(b.x,b.y,p.x,p.y)<(b.r+p.r)**2){b.dead=true;die();break}
    if(p.alive)for(const e of G.en)if(e.on&&!e.dead&&hitTest(e,p.x,p.y,p.r)){if(e.type==='drone')kill(e);die();break}
  }
  if(p.alive)for(const it of G.items)if(d2(it.x,it.y,p.x,p.y)<22*22){it.dead=true;sfx.item();
    if(it.k==='P'){if(G.power<3)G.power++;else addScore(1000);G.banner={text:G.power===3?'화력 MAX':'화력 강화',t:.9,small:true}}
    else{G.rolls=Math.min(5,G.rolls+1);G.banner={text:'회피 +1',t:.9,small:true}}
    syncHud()}

  G.pb=G.pb.filter(b=>!b.dead);G.ms=G.ms.filter(m=>!m.dead);
  G.eb=G.eb.filter(b=>!b.dead&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
  G.en=G.en.filter(e=>!e.dead);
  G.items=G.items.filter(i=>!i.dead&&i.y<H+20);
  G.fx=G.fx.filter(f=>f.life>0);
}

/* ================= draw ================= */
const SHOFF={drone:18,bomber:32,boss:46};
function playerPose(){
  const p=G.p,J=G.J,rp=p.roll>0?1-p.roll/J.rollT:0;
  return {sx:rp?Math.cos(rp*Math.PI*2):1,sz:1+Math.sin(rp*Math.PI)*.35,off:24+Math.sin(rp*Math.PI)*34,ang:clamp(p.vx/2400,-.12,.12)};
}
function draw(){
  cx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  cx.save();
  if(G&&G.shake>0)cx.translate(rand(-G.shake,G.shake),rand(-G.shake,G.shake));
  drawWorldBase();
  const live=G&&mode!=='title';
  // shadows on the sea
  if(live){
    for(const e of G.en)if(e.on)drawShadow(FOES[e.type],e.x,e.y,e.type==='drone'?e.ang:Math.PI,SHOFF[e.type]);
    if(G.p.alive){const ps=playerPose();drawShadow(G.J,G.p.x,G.p.y,ps.ang,ps.off,ps)}
  }
  drawCloudLayer(0,true);drawCloudLayer(0,false);
  if(live){
    const t=G.t,p=G.p;
    // contrails
    if(G.trail.length>2){cx.lineCap='round';
      for(const side of ['lx','rx']){for(let i=1;i<G.trail.length;i++){const a=G.trail[i-1],b=G.trail[i];cx.strokeStyle=`rgba(255,255,255,${i/G.trail.length*.35})`;cx.lineWidth=1+i/G.trail.length*1.2;cx.beginPath();cx.moveTo(a[side],a.y);cx.lineTo(b[side],b.y);cx.stroke()}}}
    // items
    for(const it of G.items){
      const pulse=1+Math.sin(it.t*8)*.08;
      cx.save();cx.translate(it.x,it.y);cx.scale(pulse,pulse);
      cx.globalCompositeOperation='lighter';disc(cx,0,0,17,it.k==='P'?'rgba(255,90,54,.25)':'rgba(47,200,180,.25)');cx.globalCompositeOperation='source-over';
      cx.fillStyle=it.k==='P'?'#ff5a36':'#22b39f';cx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;cx.lineTo(Math.cos(a)*12,Math.sin(a)*12)}cx.closePath();cx.fill();
      cx.strokeStyle='#fff';cx.lineWidth=1.6;cx.stroke();
      cx.fillStyle='#fff';cx.font='15px "Black Han Sans",sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(it.k,0,1);
      cx.restore();
    }
    // enemies, big first
    const order=G.en.filter(e=>e.on).sort((a,b)=>b.r-a.r);
    for(const e of order)drawCraft(FOES[e.type],e.x,e.y,e.type==='drone'?e.ang:Math.PI,{flash:e.flash,t:t+e.x*.1,flameC:EFLAME});
    const boss=G.en.find(e=>e.type==='boss'&&e.on);
    if(boss){cx.fillStyle='rgba(6,15,25,.6)';cx.fillRect(40,50,W-80,7);cx.fillStyle='#ff5a36';cx.fillRect(41,51,(W-82)*Math.max(0,boss.hp/boss.maxHp),5)}
    // player bullets (additive tracers)
    cx.save();cx.globalCompositeOperation='lighter';
    for(const b of G.pb){cx.save();cx.translate(b.x,b.y);cx.rotate(Math.atan2(b.vx,-b.vy));
      cx.fillStyle='rgba(255,200,90,.35)';cx.fillRect(-b.w,-9,b.w*2,18);cx.fillStyle='#fff3c2';cx.fillRect(-b.w/2,-7,b.w,14);cx.restore()}
    cx.restore();
    // missiles
    for(const m of G.ms){cx.save();cx.translate(m.x,m.y);cx.rotate(Math.atan2(m.vy,m.vx)+Math.PI/2);
      cx.fillStyle='#e8ecef';cx.fillRect(-1.4,-6,2.8,11);cx.fillStyle='#ff5a36';cx.fillRect(-1.4,-6,2.8,2.5);
      cx.globalCompositeOperation='lighter';disc(cx,0,7,2.6,'rgba(255,190,90,.9)');cx.restore()}
    // player
    if(p.alive&&!(p.inv>0&&Math.floor(p.inv*16)%2)){
      const ps=playerPose();drawCraft(G.J,p.x,p.y,ps.ang,{sx:ps.sx,sz:ps.sz,t,boost:p.roll>0?1.5:1});
    }
    // enemy bullets (energy orbs)
    cx.save();cx.globalCompositeOperation='lighter';
    for(const b of G.eb){disc(cx,b.x,b.y,b.r+3.5,'rgba(255,70,90,.28)');disc(cx,b.x,b.y,b.r,'#ff5a6e');disc(cx,b.x,b.y,b.r*.5,'#fff')}
    cx.restore();
    // fx
    for(const f of G.fx){const k=f.life/f.max;
      if(f.ring){cx.strokeStyle=`rgba(255,240,200,${k})`;cx.lineWidth=3*k;cx.beginPath();cx.arc(f.x,f.y,f.r*(1.6-k),0,7);cx.stroke();continue}
      if(f.flashOrb){cx.save();cx.globalCompositeOperation='lighter';const rg=cx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);rg.addColorStop(0,`rgba(255,250,220,${k})`);rg.addColorStop(1,'rgba(255,160,60,0)');cx.fillStyle=rg;cx.beginPath();cx.arc(f.x,f.y,f.r,0,7);cx.fill();cx.restore();continue}
      if(f.c==='smoke'){disc(cx,f.x,f.y,f.r*(2-k),`rgba(90,92,98,${k*.45})`)}
      else{cx.save();cx.globalCompositeOperation='lighter';disc(cx,f.x,f.y,f.r*(k+.3),`rgba(${f.c},${Math.min(1,k*1.4)})`);cx.restore()}
    }
  }
  drawCloudLayer(1,false);
  cx.drawImage(vignette(bg.th),0,0);
  if(bg.prev&&bg.fade>0){cx.globalAlpha=bg.fade;cx.drawImage(vignette(bg.prev),0,0);cx.globalAlpha=1}
  cx.restore();
  if(live)drawHud();
}
function drawHud(){
  cx.textBaseline='top';
  cx.font='18px "Share Tech Mono",monospace';cx.fillStyle='#eef0f2';cx.textAlign='left';
  cx.fillText(String(G.score).padStart(7,'0'),12,12);
  cx.font='11px "Share Tech Mono",monospace';cx.fillStyle='#b9cbd9';cx.fillText('SCORE',12,32);
  cx.textAlign='right';cx.font='18px "Share Tech Mono",monospace';cx.fillStyle='#ffb627';
  cx.fillText(String(Math.max(hi,G.score)).padStart(7,'0'),W-12,12);
  cx.font='11px "Share Tech Mono",monospace';cx.fillStyle='#b9cbd9';cx.fillText(`HI · ST ${G.stage}`,W-12,32);
  // jet name, power, lives
  cx.textAlign='left';cx.fillStyle='#b9cbd9';cx.font='11px "Share Tech Mono",monospace';
  cx.fillText(G.J.short.toUpperCase(),12,H-70);cx.fillText('POW',12,H-54);
  for(let i=0;i<3;i++){cx.fillStyle=i<G.power?'#ffb627':'rgba(238,240,242,.22)';cx.fillRect(40+i*12,H-53,9,9)}
  for(let i=0;i<Math.max(0,G.lives-(G.p.alive?1:0));i++){cx.save();cx.translate(20+i*20,H-22);cx.scale(.45,.45);drawBody(cx,G.J,{flame:false});cx.restore()}
  const b=G.banner;
  if(b&&b.t>0){
    cx.globalAlpha=Math.min(1,b.t*2);cx.textAlign='center';cx.textBaseline='middle';
    if(b.small){cx.font='22px "Black Han Sans",sans-serif';cx.fillStyle='#ffb627';cx.fillText(b.text,G.p.x,Math.max(70,G.p.y-50))}
    else{
      if(b.warn&&Math.floor(b.t*4)%2===0){cx.fillStyle='rgba(255,90,54,.2)';cx.fillRect(0,H/2-50,W,100)}
      cx.shadowColor='rgba(0,0,0,.55)';cx.shadowBlur=12;
      cx.font='40px "Black Han Sans",sans-serif';cx.fillStyle=b.warn?'#ff5a36':'#eef0f2';cx.fillText(b.text,W/2,H/2-12);
      if(b.sub){cx.font='19px "Do Hyeon",sans-serif';cx.fillStyle='#eef0f2';cx.fillText(b.sub,W/2,H/2+25)}
      cx.shadowBlur=0;
    }
    cx.globalAlpha=1;
  }
}

/* ================= screens ================= */
const scr={title:$('title'),pause:$('pause'),over:$('over')};
function show(name){for(const k in scr)scr[k].hidden=k!==name;$('rollBtn').hidden=!(name===null||name==='pause');$('pauseBtn').hidden=name!==null}
function syncHud(){if(!G)return;$('rollN').textContent=G.rolls;$('rollBtn').classList.toggle('empty',G.rolls<=0)}
function start(){initAudio();newGame();mode='play';show(null);syncHud();drag=null}
function pause(){if(mode!=='play')return;mode='pause';show('pause');$('resumeBtn').focus()}
function resume(){if(mode!=='pause')return;mode='play';show(null);last=performance.now()}
function toTitle(){mode='title';G=null;setTheme(0);$('titleHi').textContent=hi.toLocaleString();show('title')}
function gameOver(){
  mode='over';const isNew=G.score>hi;if(isNew){hi=G.score;saveHi()}
  $('finalJet').textContent=G.J.short;$('finalScore').textContent=G.score.toLocaleString();$('finalStage').textContent='STAGE '+G.stage;
  $('finalHi').textContent=hi.toLocaleString();$('newHi').hidden=!isNew;show('over');$('retryBtn').focus();
}
$('startBtn').onclick=start;$('retryBtn').onclick=start;$('homeBtn').onclick=toTitle;
$('resumeBtn').onclick=resume;$('quitBtn').onclick=toTitle;$('pauseBtn').onclick=pause;
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent=muted?'소리 켜기':'소리 끄기'};
$('rollBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();doRoll()});

/* ================= input ================= */
function gamePt(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{
  if(mode!=='play'||!G)return;const g=gamePt(e);
  drag={id:e.pointerId,x:g.x,y:g.y,px:G.p.x,py:G.p.y};G.p.tx=G.p.x;G.p.ty=G.p.y;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId||!G||mode!=='play'||!G.p.alive)return;
  const g=gamePt(e);G.p.tx=clamp(drag.px+(g.x-drag.x)*1.25,18,W-18);G.p.ty=clamp(drag.py+(g.y-drag.y)*1.25,50,H-30);
});
const endDrag=e=>{if(drag&&drag.id===e.pointerId){drag=null;if(G){G.p.tx=null}}};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)&&mode==='play')e.preventDefault();
  keys[k]=true;
  if((k===' '||k==='z')&&mode==='play')doRoll();
  if(k==='p'||k==='escape'){mode==='play'?pause():mode==='pause'&&resume()}
  if(mode==='title'){if(k==='arrowright')selectJet((jetIdx+1)%JETS.length);if(k==='arrowleft')selectJet((jetIdx+JETS.length-1)%JETS.length);if(k==='enter'&&(!document.activeElement||document.activeElement===document.body))start()}
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

/* ================= loop ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(mode!=='pause')updateBg(dt);
  if(mode==='play')update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
